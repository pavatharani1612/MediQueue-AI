{% extends "base.html" %}{% block content %}
<div class="container" style="max-width:720px">
  <div class="card">
    <h2 class="section-title" style="font-size:26px">Patient Registration</h2>
    <form method="post">
      <div class="form-grid">
        <div><label>Full Name</label><input name="name" required/></div>
        <div><label>Age</label><input name="age" type="number" min="1" required/></div>
        <div><label>Gender</label>
          <select name="gender"><option>Male</option><option>Female</option><option>Other</option></select>
        </div>
        <div><label>Phone</label><input name="phone" required/></div>
        <div><label>Email</label><input name="email" type="email" required/></div>
        <div><label>Blood Group</label>
          <select name="blood_group">
            {% for b in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option>{{b}}</option>{% endfor %}
          </select>
        </div>
        <div style="grid-column:1/-1"><label>Address</label><input name="address" required/></div>
        <div><label>Password</label><input type="password" name="password" required/></div>
        <div><label>Confirm Password</label><input type="password" name="confirm" required/></div>
      </div>
      <button class="btn" style="width:100%;margin-top:16px">Create Account</button>
    </form>
  </div>
</div>{% endblock %}

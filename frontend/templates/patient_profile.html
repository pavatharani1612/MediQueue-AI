{% extends "base.html" %}{% block content %}
<div class="container" style="max-width:720px">
  <div class="card">
    <h2 class="section-title" style="font-size:26px">Edit Profile</h2>
    <form method="post">
      <div class="form-grid">
        <div><label>Name</label><input name="name" value="{{pt.name}}"/></div>
        <div><label>Age</label><input name="age" type="number" value="{{pt.age}}"/></div>
        <div><label>Gender</label>
          <select name="gender">{% for g in ['Male','Female','Other'] %}<option {% if pt.gender==g %}selected{% endif %}>{{g}}</option>{% endfor %}</select>
        </div>
        <div><label>Phone</label><input name="phone" value="{{pt.phone}}"/></div>
        <div style="grid-column:1/-1"><label>Address</label><input name="address" value="{{pt.address}}"/></div>
        <div><label>Blood Group</label>
          <select name="blood_group">{% for b in ['A+','A-','B+','B-','O+','O-','AB+','AB-'] %}<option {% if pt.blood_group==b %}selected{% endif %}>{{b}}</option>{% endfor %}</select>
        </div>
        <div><label>Email (locked)</label><input value="{{pt.email}}" disabled/></div>
      </div>
      <button class="btn" style="margin-top:14px">Save Changes</button>
    </form>
  </div>
</div>{% endblock %}
